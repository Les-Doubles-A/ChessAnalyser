[package]
name = "chessanalyser"
version = "0.2.0"
edition = "2024"
description = "Revue de parties chess.com analysées par Stockfish natif"
license = "GPL-3.0-or-later"
repository = "https://github.com/Les-Doubles-A/ChessAnalyser"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
directories = "6.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pgn-reader = "0.29.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shakmaty = "0.30.3"
ureq = "3.5.2"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
